# Contratos legíveis por agente; o validador usa JSON Schema 2020-12 expresso em YAML.
schema_version: 1
state:
  type: object
  additionalProperties: false
  required: [schema_version, project, updated_at, goal, phase, status, next_action, last_observation, completed_checks, open_cases]
  properties:
    schema_version: {const: 1}
    project: {const: formatacao-correta}
    updated_at: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
    goal: {type: string, minLength: 20}
    phase: {enum: [preflight, repair, installation, validation, complete]}
    status: {enum: [awaiting_user_result, in_progress, blocked, completed]}
    next_action:
      type: object
      additionalProperties: false
      required: [id, instruction, expected_evidence, why_now]
      properties:
        id: {type: string, minLength: 3}
        instruction: {type: string, minLength: 12}
        expected_evidence: {type: string, minLength: 8}
        why_now: {type: string, minLength: 8}
    last_observation:
      type: object
      additionalProperties: false
      required: [observed_at, source, evidence_ref, summary]
      properties:
        observed_at: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
        source: {enum: [user_image, user_report, raw_log, prior_audit]}
        evidence_ref: {type: string, pattern: "^EV-[0-9]{2,}$"}
        summary: {type: string, minLength: 12}
    completed_checks:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [id, result, observed_at, source, evidence_ref]
        properties:
          id: {type: string, minLength: 3}
          result: {type: string, minLength: 8}
          observed_at: {type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$"}
          source: {enum: [user_image, user_report, raw_log, prior_audit]}
          evidence_ref: {type: string, pattern: "^EV-[0-9]{2,}$"}
    open_cases:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [id, file, status]
        properties:
          id: {type: string, minLength: 3}
          file: {type: string, minLength: 5}
          status: {enum: [pending, historical, in_progress, resolved, blocked, limitation]}
router:
  type: object
  additionalProperties: false
  required: [schema_version, default, routes]
  properties:
    schema_version: {const: 1}
    default:
      type: array
      minItems: 1
      uniqueItems: true
      items: {type: string, minLength: 5}
    routes:
      type: array
      minItems: 4
      items:
        type: object
        additionalProperties: false
        required: [id, keywords, files]
        properties:
          id: {type: string, minLength: 2}
          keywords:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, minLength: 2}
          files:
            type: array
            minItems: 1
            uniqueItems: true
            items: {type: string, minLength: 5}
